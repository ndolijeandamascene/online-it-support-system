{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Online IT Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="auth-brand"><i class="bi bi-headset"></i></div>
        <h1>Online IT Support</h1>
        <p class="text-muted">Sign in to manage support requests.</p>
        <form method="post" class="vstack gap-3">
            {% csrf_token %}
            {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
            <div>
                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                <input class="form-control" type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" required autofocus>
            </div>
            <div>
                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                <input class="form-control" type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
    </main>
</body>
</html>
