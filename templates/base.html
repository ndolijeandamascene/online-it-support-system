{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online IT Support{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="brand" href="{% url 'dashboard' %}">Online IT Support</a>
            <div class="nav-actions">
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'ticket_list' %}">Tickets</a>
                <a href="{% url 'knowledge_list' %}">Knowledge</a>
                <a href="{% url 'reports' %}">Reports</a>
                <a class="button button-primary" href="{% url 'ticket_create' %}">New ticket</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
